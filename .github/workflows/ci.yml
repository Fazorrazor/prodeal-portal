name: Elite FAANG-Tier CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  # 1. SECURITY & COMPLIANCE (SAST, SCA, Trivy & Supply-Chain Vet)
  security-audit:
    name: SAST (CodeQL), SCA, Trivy & Supply-Chain Vet
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      # Supply-chain & agent skill deterministic vet
      - name: Deterministic Supply-Chain & Skill Vet
        run: |
          npm run vet:self
          npm run vet:skills

      # SCA: Production Dependency Vulnerability Scan
      - name: Production Dependency Vulnerability Scan (SCA)
        run: npm audit --omit=dev --audit-level=high

      # Trivy: Vulnerabilities, Secrets & Misconfigurations
      - name: Run Trivy Filesystem Security Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: 'true'
          trivyignores: '.trivyignore.yaml'
          skip-dirs: 'node_modules,.next,.git,coverage,resources'

      # SAST: CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, typescript
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # 2. QUALITY, SECURITY REGRESSION & COVERAGE
  quality-and-build:
    name: Multi-Gate Verify & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Run Multi-Gate Verification Suite
        run: npm run verify

      - name: Unit Tests & Coverage
        run: npx vitest run --coverage
      
      - name: Report Coverage to PR
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-artifact
          path: coverage/

  # 3. PREVIEW DEPLOYMENT & PR COMMENT
  preview-deploy:
    name: Vercel Preview Deployment
    if: github.event_name == 'pull_request'
    needs: [security-audit, quality-and-build]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
      
      - name: Build Vercel Preview Artifacts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: vercel build --token=$VERCEL_TOKEN

      - name: Deploy to Vercel Preview
        id: deploy
        run: |
          PREVIEW_RAW=$(vercel deploy --prebuilt --archive=tgz --token=$VERCEL_TOKEN)
          PREVIEW_URL=$(echo "$PREVIEW_RAW" | tail -n 1 | tr -d '\r')
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
      
      - name: Comment PR with Preview URL
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Vercel Preview Deployed!**\n\n🔍 Review your changes live at: ${process.env.PREVIEW_URL}`
            })

  # 4. PREVIEW VALIDATION (E2E & Lighthouse)
  preview-validation:
    name: Playwright E2E & Lighthouse CI
    if: github.event_name == 'pull_request'
    needs: preview-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci
      
      - name: Install Playwright
        run: npx playwright install --with-deps
      
      - name: Wait for preview to become healthy
        env:
          PREVIEW_URL: ${{ needs.preview-deploy.outputs.preview_url }}/api/health
          VERCEL_AUTOMATION_BYPASS_TOKEN: ${{ secrets.VERCEL_AUTOMATION_BYPASS_TOKEN }}
        run: |
          node -e "
            (async () => {
              const url = process.env.PREVIEW_URL;
              console.log('Checking preview URL with fetch:', url);
              if (!url || url === '/api/health') {
                console.error('Preview URL is empty');
                process.exit(1);
              }
              
              let success = false;
              for (let i = 1; i <= 15; i++) {
                try {
                  const resp = await fetch(url, {
                    headers: {
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)',
                      'x-vercel-protection-bypass': process.env.VERCEL_AUTOMATION_BYPASS_TOKEN || ''
                    }
                  });
                  if (resp.status === 200) {
                    success = true;
                    console.log('Preview healthy!');
                    break;
                  }
                  const text = await resp.text();
                  console.log(\`Attempt \${i}: status \${resp.status}, body: \${text.substring(0, 200)}\`);
                } catch (err) {
                  console.log(\`Attempt \${i} failed:\`, err.message);
                }
                await new Promise(r => setTimeout(r, 5000));
              }
              
              if (!success) {
                console.error('Preview not healthy after retries');
                process.exit(1);
              }
            })();
          "
          
      # Run Playwright AGAINST the live Vercel Preview URL
      - name: Run Playwright Tests
        run: npx playwright test
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ needs.preview-deploy.outputs.preview_url }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERCEL_AUTOMATION_BYPASS_TOKEN: ${{ secrets.VERCEL_AUTOMATION_BYPASS_TOKEN }}
          
      # Run Lighthouse Performance Audit AGAINST the live Vercel Preview URL
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        env:
          VERCEL_AUTOMATION_BYPASS_TOKEN: ${{ secrets.VERCEL_AUTOMATION_BYPASS_TOKEN }}
        with:
          urls: |
            ${{ needs.preview-deploy.outputs.preview_url }}
            ${{ needs.preview-deploy.outputs.preview_url }}/divisions/bowls
            ${{ needs.preview-deploy.outputs.preview_url }}/divisions/chemicals
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./lighthouserc.js

  # 5. PRODUCTION DEPLOY, SMOKE TEST & AUTO-ROLLBACK
  production-deploy:
    name: Production Deployment & Rollback Strategy
    if: github.ref == 'refs/heads/main'
    needs: [security-audit, quality-and-build]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN
      
      - name: Build Vercel Production Artifacts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy to Vercel Production
        id: prod_deploy
        run: |
          PROD_RAW=$(vercel deploy --prebuilt --archive=tgz --prod --token=$VERCEL_TOKEN)
          PROD_URL=$(echo "$PROD_RAW" | tail -n 1 | tr -d '\r')
          echo "prod_url=$PROD_URL" >> "$GITHUB_OUTPUT"
          
      - name: Post-Deploy Smoke Test
        id: smoke_test
        run: |
          echo "Waiting 10 seconds for Edge CDN propagation..."
          sleep 10
          # Ping homepage AND deep /api/health (verifies env + live Supabase readiness).
          HOME_STATUS=$(curl -o /dev/null -s -w "%{http_code}" "${{ steps.prod_deploy.outputs.prod_url }}")
          HEALTH_STATUS=$(curl -o /dev/null -s -w "%{http_code}" "${{ steps.prod_deploy.outputs.prod_url }}/api/health")
          echo "Smoke check statuses -> home=${HOME_STATUS}, health=${HEALTH_STATUS}"
          if [ "$HOME_STATUS" -ne 200 ] || [ "$HEALTH_STATUS" -ne 200 ]; then
            echo "Smoke test failed (home=${HOME_STATUS}, health=${HEALTH_STATUS})!"
            exit 1
          fi

      - name: Automated Rollback on Failure
        if: failure()
        run: |
          echo "Smoke test failed or deployment crashed! Initiating Vercel Rollback..."
          # Revert to the last known good deployment instantly using strict token auth
          vercel rollback --yes --token=$VERCEL_TOKEN
          
      # "Fix && Bug": Auto-create a GitHub issue if prod deployment crashes
      - name: Create Bug Report Issue
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Production Deployment Failed & Auto-Rolled Back`,
              body: `The production deployment failed the smoke test (returned non-200 status).\n\n**Action Taken:** The system automatically initiated a \`vercel rollback\` to the previous stable state.\n\nInvestigate the GitHub Actions logs immediately to apply a **fix**.`
            })
